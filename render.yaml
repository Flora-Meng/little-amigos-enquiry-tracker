services:
  - type: web
    name: littleamigos-workplace
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: little-amigos-enquiry-tracker-db
          property: connectionString
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false

databases:
  - name: little-amigos-enquiry-tracker-db
    plan: free
    region: singapore
